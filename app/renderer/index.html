<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>MCII</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="station/station.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dotring"><span class="dot"></span></span> MCII <span class="tag">station</span></div>
    <div class="barright">
      <span id="status" class="status"></span>
      <button id="share" class="btn">Save &amp; share my changes</button>
      <button id="update" class="btn">Check for updates</button>
      <button id="refresh" class="btn">Refresh</button>
    </div>
  </header>
  <div class="viewport" aria-hidden="true"></div>
  <nav class="tabs">
    <!-- ⚠️ SCAFFOLDING. The tab bar is deleted at gate 4, when the Observatory
         becomes the room you land in. Getting to a screen is meant to be
         physical -- you turn and walk. A tab bar makes that optional, and
         optional things get kept. -->
    <button class="tab" data-view="observatory">The Observatory</button>
    <button class="tab active" data-view="watch">Your coins</button>
    <button class="tab" data-view="market">Market <span class="count" id="mktcount"></span></button>
    <button class="tab" data-view="sector">What's happening</button>
    <button class="tab" data-view="journal">Journal <span class="count" id="jcount"></span></button>
  </nav>
  <section class="search">
    <input id="q" type="text" placeholder="Search any memecoin by name, or paste a contract address" autocomplete="off">
    <button id="go" class="btn">Search</button>
  </section>
  <div id="results" class="results"></div>
  <section id="collhealth" class="alerts"></section>
  <section id="alerts" class="alerts"></section>
  <main id="grid" class="grid"></main>
  <main id="market" class="grid" hidden></main>
  <main id="sector" class="grid" hidden>
    <div id="sectorbody"></div>
    <!-- A separate site, not part of MCII's own analysis -- see 70-AREAS/j7-tracker/README.md for
         why this is a plain embedded window and not a data integration. No preload here: this page
         gets none of window.mcii, same as any other tab open in a real browser. Kept OUTSIDE
         #sectorbody so loadSector()'s innerHTML rewrite never reloads it -- it opens once and
         stays open, logged in, across every visit to this tab rather than restarting each time. -->
    <div class="card j7card">
      <div class="chead"><b>J7 Tracker</b><span class="v">their site, embedded as-is</span></div>
      <p class="note">Not part of MCII's own analysis — nothing you do here is read by, or shared
        with, the rest of this app.</p>
      <webview id="j7view" src="https://j7tracker.io" partition="persist:j7tracker" allowpopups></webview>
    </div>
  </main>
  <main id="journal" class="grid" hidden></main>
  <footer class="foot">
    <span>Read-only. This app cannot trade, and holds no wallet or exchange keys.</span>
    <span id="stamp"></span>
  </footer>
  <div id="observatory"></div>
  <script src="app.js"></script>
  <script type="module" src="station/boot.js"></script>
</body>
</html>
