<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CII (visual test harness — not the real app)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="station/station.css">
<link rel="stylesheet" href="station/rooms.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dotring"><span class="dot"></span></span> CII <span class="tag">station</span></div>
    <div class="barright">
      <span id="status" class="status"></span>
      <button id="share" class="btn">Save &amp; share my changes</button>
      <button id="update" class="btn">Check for updates</button>
      <button id="refresh" class="btn">Refresh</button>
    </div>
  </header>
  <div class="viewport" aria-hidden="true"></div>
  <nav class="tabs">
    <button class="tab" data-view="observatory">The Observatory</button>
    <button class="tab active" data-view="watch">Your coins</button>
    <button class="tab" data-view="market">Market <span class="count" id="mktcount"></span></button>
    <button class="tab" data-view="sector">What's happening</button>
    <button class="tab" data-view="journal">Journal <span class="count" id="jcount"></span></button>
    <button class="tab" data-view="folio">Portfolio</button>
    <button class="tab" data-view="war">War Room</button>
    <button class="tab" data-view="fomo">FOMO</button>
    <button class="tab" data-view="axiom">Axiom</button>
  </nav>
  <section class="search">
    <input id="q" type="text" placeholder="Search any memecoin by name, or paste a contract address" autocomplete="off">
    <button id="go" class="btn">Search</button>
  </section>
  <div id="results" class="results"></div>
  <section id="collhealth" class="alerts"></section>
  <section id="alerts" class="alerts"></section>
  <main id="grid" class="grid"></main>
  <div id="room-watch" hidden></div>
  <main id="market" class="grid" hidden></main>
  <div id="room-market" hidden></div>
  <main id="sector" class="grid" hidden></main>
  <div id="room-sector" hidden></div>
  <main id="journal" class="grid" hidden></main>
  <div id="room-journal" hidden></div>
  <main id="folio" class="grid" hidden></main>
  <div id="room-folio" hidden></div>
  <!-- The War Room has NO flat <main> of its own: it is the one view that never
       existed as a flat screen, so there is nothing to fall back to. switchView()
       in app.js needs no change for it -- an unknown view id hides every flat main
       and loads nothing, which is exactly what a room-only view wants. -->
  <div id="room-war" hidden></div>
  <div class="rm-venue-wrap"><div class="rm-venue-beyond"></div><main id="fomo" class="venue" hidden></main></div>
  <div class="rm-venue-wrap"><div class="rm-venue-beyond"></div><main id="axiom" class="venue" hidden></main></div>
  <footer class="foot">
    <span>No keys here, and nothing in this app moves money. Venue rooms are the venues’ own pages.</span>
    <span id="stamp"></span>
  </footer>
  <div id="observatory"></div>
  <script src="mock-mcii.js"></script>
  <script src="app.js"></script>
  <script type="module" src="station/boot.js"></script>
</body>
</html>
