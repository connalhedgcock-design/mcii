name: Collect market and social data

on:
  schedule:
    # Hourly, and not on the hour. The repo is public, so minutes are free; what caps the cadence
    # is the X budget, since every run pays for social posts. Hourly sits well inside the $12.
    #
    # ! the minute matters. This ran at :07 for a day and GitHub fired it ZERO times out of 27 —
    # scheduled runs are queued best-effort and the top of the hour is the busiest slot, where
    # they are dropped rather than delayed. Moved to :37. If this still does not fire, the answer
    # is not a different minute, it is that GitHub's scheduler cannot be relied on and collection
    # has to be triggered by something we control.
    - cron: '37 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      hours:
        description: 'How many hourly collections this run should do (max 6)'
        default: '6'

# Only one collection at a time. Two runs appending to the same files would interleave lines.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # just under GitHub's six-hour ceiling
    permissions:
      contents: write       # needed to commit the collected data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ! ONE TRIGGER BUYS SIX HOURS, NOT ONE.
      #
      # GitHub's scheduler fired this zero times out of twenty-seven, so the design stopped
      # depending on it being reliable. Instead of collecting once and exiting, the job stays up
      # and collects every hour for six hours -- GitHub's maximum job length -- committing after
      # each pass. A single firing, from the schedule or from a person clicking Run workflow,
      # now covers a whole evening rather than one hour.
      #
      # This does not make the timer work. It makes the timer matter six times less.
      - name: Collect, hourly, for as long as the job may live
        working-directory: app
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          X_MONTHLY_CAP_USD: '12'
          PASSES: ${{ github.event.inputs.hours || '6' }}
        run: |
          for i in $(seq 1 "$PASSES"); do
            echo "=== pass $i of $PASSES ==="
            node main/cloud-collect.js || echo "pass $i failed, carrying on"
            cd .. && git add data/ && \
              git -c user.name=mcii-collector -c user.email=collector@users.noreply.github.com \
                  commit -q -m "data: collection $(date -u '+%Y-%m-%d %H:%M UTC')" 2>/dev/null && \
              (git pull -q --rebase --autostash && git push -q) || echo "nothing new to commit"
            cd app
            # Skip the wait after the final pass so the job ends rather than idling for an hour.
            [ "$i" -lt "$PASSES" ] && sleep 3600 || true
          done
