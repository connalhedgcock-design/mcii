name: Collect market and social data

on:
  schedule:
    # Hourly, and not on the hour. The repo is public, so minutes are free; what caps the cadence
    # is the X budget, since every run pays for social posts. Hourly sits well inside the $12.
    #
    # ! the minute matters. This ran at :07 for a day and GitHub fired it ZERO times out of 27 —
    # scheduled runs are queued best-effort and the top of the hour is the busiest slot, where
    # they are dropped rather than delayed. Moved to :37 on 08-28 and has fired on time every hour
    # since (checked via the Actions API, not assumed). D-61's two-week bar isn't met yet, but the
    # scheduler is no longer the suspect it once was.
    - cron: '37 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab, one pass

# Only one collection at a time -- two runs appending to the same files would interleave lines.
# cancel-in-progress is TRUE on purpose: if a run ever hangs (a stuck network call, a wedged
# runner), the next hourly trigger kills it and starts clean instead of queueing behind it
# forever. Costs nothing in the normal case -- a healthy run finishes in minutes, long before the
# next trigger arrives 60 minutes later.
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # One pass, not six hours of sleeping in a loop. cloud-collect.js's own header says "runs once
    # and exits" -- the old workflow loop contradicted that. The loop existed to make one firing
    # cover a whole evening while the scheduler was suspected broken; instead it became a single
    # long-lived job that could hang for hours and, via the concurrency lock above, block every
    # scheduled run behind it. 08-29: a run hung 00:10-03:37 UTC (an un-timed-out RPC call, fixed
    # in main/adapters/onchain.js) and every trigger in that window queued up and got cancelled
    # without ever running. 15 minutes is generous for one pass; if it's not done by then something
    # is actually stuck, and cutting it off frees the lock for the next hourly trigger.
    timeout-minutes: 15
    permissions:
      contents: write       # needed to commit the collected data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        working-directory: app
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          X_MONTHLY_CAP_USD: '12'
        run: node main/cloud-collect.js

      - name: Commit and push whatever was collected
        run: |
          git add data/
          git -c user.name=mcii-collector -c user.email=collector@users.noreply.github.com \
              commit -q -m "data: collection $(date -u '+%Y-%m-%d %H:%M UTC')" 2>/dev/null || \
              { echo "nothing new to commit"; exit 0; }
          git pull -q --rebase --autostash && git push -q
