name: Collect market and social data

on:
  schedule:
    # Hourly, and not on the hour. The repo is public, so minutes are free; what caps the cadence
    # is the X budget, since every run pays for social posts. Hourly sits well inside the $12.
    #
    # ! the minute matters. This ran at :07 for a day and GitHub fired it ZERO times out of 27 —
    # scheduled runs are queued best-effort and the top of the hour is the busiest slot, where
    # they are dropped rather than delayed. Moved to :37. If this still does not fire, the answer
    # is not a different minute, it is that GitHub's scheduler cannot be relied on and collection
    # has to be triggered by something we control.
    - cron: '37 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Only one collection at a time. Two runs appending to the same files would interleave lines.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # needed to commit the collected data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        working-directory: app
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          X_MONTHLY_CAP_USD: '12'
        run: node main/cloud-collect.js

      - name: Commit results
        run: |
          git config user.name  "mcii-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "nothing collected this run"
            exit 0
          fi
          git commit -m "data: collection $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while this one was collecting. Rebase rather than force:
          # every write here is an append, so rebasing preserves both sets of rows.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
