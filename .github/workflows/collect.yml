name: Collect market and social data

on:
  # !! THE SCHEDULE IS OFF. Collection moved to a $5/mo server on 2026-09-01 — see D-98 and
  # `70-AREAS/collection-host/`. This workflow is kept as a MANUAL BACKUP only: if the server dies,
  # `workflow_dispatch` still runs a full pass on demand, and re-enabling the cron is uncommenting
  # four lines.
  #
  # ! DO NOT RE-ENABLE THE CRON WHILE THE SERVER TIMER IS RUNNING. Both would collect the same
  # data twice, pay twitterapi.io twice for it, and race each other pushing to `data/`.
  #
  # Why it moved, from the record rather than from feeling: across 08-27..09-01 the scheduler
  # produced five collection blackouts. Four were runs CANCELLED mid-flight by the next trigger
  # (`cancel-in-progress`, itself the fix for an earlier hang), losing everything they had
  # collected; one was GitHub simply never firing for ~3 hours. That is ~13 hours missing from a
  # 4.6-day record, and only ONE of the five was ever noticed at the time. D-61 said this
  # scheduler is best-effort and set "proves reliable over two weeks" as the bar to trust it. It
  # did not clear that bar, so this is D-61's own reopen trigger firing as designed.
  #
  # schedule:
  #   - cron: '12,42 * * * *'
  workflow_dispatch:        # manual backup — one pass, on demand

# Only one collection at a time -- two runs appending to the same files would interleave lines.
# cancel-in-progress is TRUE on purpose: if a run ever hangs (a stuck network call, a wedged
# runner), the next trigger kills it and starts clean instead of queueing behind it forever.
# Costs nothing in the normal case -- a healthy run finishes in minutes, long before the next
# trigger arrives 30 minutes later.
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # One pass, not six hours of sleeping in a loop. cloud-collect.js's own header says "runs once
    # and exits" -- the old workflow loop contradicted that. The loop existed to make one firing
    # cover a whole evening while the scheduler was suspected broken; instead it became a single
    # long-lived job that could hang for hours and, via the concurrency lock above, block every
    # scheduled run behind it. 08-29: a run hung 00:10-03:37 UTC (an un-timed-out RPC call, fixed
    # in main/adapters/onchain.js) and every trigger in that window queued up and got cancelled
    # without ever running. 15 minutes is generous for one pass; if it's not done by then something
    # is actually stuck, and cutting it off frees the lock for the next trigger.
    timeout-minutes: 15
    permissions:
      contents: write       # needed to commit the collected data back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        working-directory: app
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          X_MONTHLY_CAP_USD: '24'
        run: node main/cloud-collect.js

      - name: Commit and push whatever was collected
        run: |
          git add data/
          git -c user.name=mcii-collector -c user.email=collector@users.noreply.github.com \
              commit -q -m "data: collection $(date -u '+%Y-%m-%d %H:%M UTC')" 2>/dev/null || \
              { echo "nothing new to commit"; exit 0; }
          git pull -q --rebase --autostash && git push -q
